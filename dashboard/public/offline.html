<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007373">
<title>离线 · Coast2030</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f0e6;
    color: #171009;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 24px;
  }
  .card { text-align: center; max-width: 320px; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.6; color: #2f2419; opacity: .75; margin-bottom: 24px; }
  button {
    appearance: none;
    border: none;
    border-radius: 999px;
    background: #007373;
    color: #fcfaf6;
    font-size: 15px;
    padding: 12px 32px;
    cursor: pointer;
  }
  button:active { background: #005b5c; }
</style>
</head>
<body>
  <div class="card">
    <img src="/coast-logo.svg" alt="Coast2030">
    <h1>当前处于离线状态</h1>
    <p>看板数据需要联网同步。已访问过的页面可离线查看，恢复网络后将自动刷新。</p>
    <button type="button" onclick="location.reload()">重试</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
